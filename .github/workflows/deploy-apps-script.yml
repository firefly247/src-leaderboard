name: Deploy Google Apps Script

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Explicit recovery only; never resurrect the retired API on a normal push.
    if: ${{ vars.ENABLE_LEGACY_APPS_SCRIPT_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLASP_DEPLOYMENT_ID: AKfycbwxHRgWZWMisQzVIK8KogLwU2ri5EfhCnY2FqqBLm7Nb8Oo9DYNIF_L28UgMfwO9q2f
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Google authentication
        if: ${{ env.CLASPRC_JSON != '' }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Push and redeploy the existing web app
        if: ${{ env.CLASPRC_JSON != '' }}
        run: |
          clasp push --force
          clasp create-deployment --deploymentId "$CLASP_DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA}"

      - name: Report missing authentication secret
        if: ${{ env.CLASPRC_JSON == '' }}
        run: echo "::warning::CLASPRC_JSON secret is not configured, so Apps Script deployment was skipped."
