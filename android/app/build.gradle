plugins { id 'com.android.application' }

def releaseKeys = new Properties()
def keyFile = rootProject.file('signing.properties')
if (keyFile.exists()) keyFile.withInputStream { releaseKeys.load(it) }

android {
    namespace 'io.github.firefly247.srcleaderboard'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId 'io.github.firefly247.srcleaderboard'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            if (!releaseKeys.isEmpty()) {
                storeFile rootProject.file(releaseKeys['storeFile'])
                storePassword releaseKeys['storePassword']
                keyAlias releaseKeys['keyAlias']
                keyPassword releaseKeys['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

tasks.register('requireReleaseKeys') {
    doLast { if (releaseKeys.isEmpty()) throw new GradleException('Create local signing.properties before building a release APK.') }
}
tasks.configureEach { if (name == 'preReleaseBuild') dependsOn 'requireReleaseKeys' }
