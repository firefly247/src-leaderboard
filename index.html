<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="삼성조정클럽 ERG 기록 리더보드"><title>삼성조정클럽 ERG 명예의 전당</title><link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="#leaderboard" aria-label="리더보드 홈"><span class="brand-mark">◫</span><span>삼성조정클럽 ERG 명예의 전당</span></a><nav class="main-tabs" aria-label="주요 메뉴"><button class="tab-button is-active" data-tab="leaderboard" type="button">리더보드</button><button class="tab-button" data-tab="request" type="button">기록 추가 요청</button><button class="tab-button" data-tab="admin" type="button">관리자</button><button id="refreshButton" class="refresh-button" type="button" aria-label="최신 데이터 새로고침"><span aria-hidden="true">↻</span></button></nav></header>
  <main class="page-shell"><div id="statusMessage" class="status-message" role="status">기록을 불러오는 중입니다.</div>
    <section class="tab-panel is-active" data-panel="leaderboard"><section id="topChampions" class="top-champions" aria-label="종목별 1위"></section><div id="eventSections" class="event-sections" aria-label="종목별 순위"></div><section class="panel"><div class="section-heading table-heading"><div><p class="eyebrow">MEMBERS</p><h2>회원별 PB</h2></div><input id="memberSearch" class="search-input" type="search" placeholder="회원 검색" aria-label="회원 검색"></div><div class="table-wrap"><table id="memberTable" class="member-summary-table"><thead></thead><tbody></tbody></table></div></section></section>
    <section class="tab-panel" data-panel="request"><section class="panel form-panel"><p class="eyebrow">RECORD REQUEST</p><h1>기록 추가 요청</h1><p class="form-description">신청 내용은 관리자 승인 후 리더보드에 반영됩니다.</p><form id="recordRequestForm"><div class="form-grid"><label><span>이름 <span class="required-mark" aria-label="필수">*</span></span><select id="memberSelect" name="existingMember"><option value="" selected disabled>회원 선택</option><option value="__new__">회원명 직접 입력</option></select></label><input id="memberNameInput" class="paired-input" name="memberName" maxlength="50" placeholder="회원명" aria-label="회원명" readonly required></div><div class="form-grid"><label><span>종목명 <span class="required-mark" aria-label="필수">*</span></span><select id="requestEvent" name="eventId"><option value="" selected disabled>종목 선택</option><option value="__new__">종목명 직접 입력</option></select></label><input id="eventNameInput" class="paired-input" name="eventName" maxlength="50" placeholder="종목명" aria-label="종목명" readonly required></div><div class="form-grid"><label>대회/장소<select id="competitionSelect" name="existingCompetition"><option value="" selected disabled>대회/장소 선택</option><option value="__new__">대회/장소명 직접 입력</option></select></label><input id="competitionInput" class="paired-input" name="competition" maxlength="100" placeholder="대회/장소명" aria-label="대회/장소명" readonly required></div><div class="form-grid"><label><span>날짜 <span class="required-mark" aria-label="필수">*</span></span><input name="competitionDate" type="date" required></label><label><span>기록 <span class="required-mark" aria-label="필수">*</span></span><div class="time-inputs"><input name="minutes" type="number" inputmode="numeric" min="0" max="99" value="0" required aria-label="분"><span>분</span><input name="seconds" type="number" inputmode="numeric" min="0" max="59" required aria-label="초"><span>초</span><input name="tenths" type="number" inputmode="numeric" min="0" max="9" value="0" required aria-label="소수점 첫째 자리"></div><small>예: 1분 32초 0 → 1:32.0</small></label></div><label>메모<input name="note" maxlength="300" placeholder="선택 입력"></label><label><span>증빙사진 <span class="required-mark" aria-label="필수">*</span></span><input id="proofPhoto" name="proofPhoto" type="file" accept="image/*" required><small>업로드 후 300KB 이하로 자동 압축됩니다.</small></label><button class="primary-button" type="submit">기록 추가 요청</button><p id="recordRequestResult" class="form-result" role="status"></p></form></section></section>
    <section class="tab-panel" data-panel="admin"><section id="adminLogin" class="panel form-panel"><p class="eyebrow">ADMIN</p><h1>관리자 인증</h1><form id="adminLoginForm"><label>관리자 비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">인증</button><p id="adminLoginResult" class="form-result" role="status"></p></form></section><section id="adminConsole" hidden><div class="admin-subtabs"><button data-admin-view="add" class="is-active">기록 추가 요청</button><button data-admin-view="delete">기록 삭제 요청</button><button data-admin-view="events">종목 관리</button><button data-admin-view="history">처리 이력</button><button id="adminLogout" class="secondary-button">로그아웃</button></div><div id="adminContent" class="panel"></div></section></section>
  </main>
  <dialog id="memberDialog" class="member-dialog" aria-labelledby="dialogMemberName"><div class="dialog-header"><div><p class="eyebrow">MEMBER RECORDS</p><h2 id="dialogMemberName"></h2></div><button id="dialogCloseButton" class="dialog-close" type="button" aria-label="팝업 닫기">×</button></div><div id="dialogContent"></div></dialog><dialog id="photoDialog" class="photo-dialog"><button class="dialog-close" type="button" data-close-photo aria-label="팝업 닫기">×</button><img id="proofPhotoImage" alt="기록 증빙사진"></dialog>
  <footer>© <span id="currentYear"></span> 삼성조정클럽</footer><script src="static/leaderboard.js"></script>
</body>
</html>
